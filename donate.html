
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate Blood - LifeSaver Blood Bank</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #fff5f5;
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: #b30000;
      color: white;
      padding: 1rem 2rem;
    }

    header h1 {
      font-size: 2rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .form-section {
      padding: 2rem;
      background: white;
      max-width: 600px;
      margin: 2rem auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #b30000;
    }

    .form-section form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    form label {
      display: flex;
      flex-direction: column;
      font-weight: bold;
      gap: 0.35rem;
    }

    form input,
    form select {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    form input:focus,
    form select:focus {
      outline: 2px solid #b30000;
      outline-offset: 1px;
    }

    button[type="submit"] {
      background-color: #b30000;
      color: white;
      padding: 0.85rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #990000;
    }

    button[type="submit"]:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #formMessage {
      display: none;
      padding: 0.8rem;
      border-radius: 5px;
      margin-bottom: 1rem;
      overflow-wrap: anywhere;
    }

    #formMessage.success {
      display: block;
      color: #155724;
      background: #d4edda;
    }

    #formMessage.error {
      display: block;
      color: #721c24;
      background: #f8d7da;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #f3e0e0;
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 1rem;
      }

      nav ul {
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-section {
        margin: 1rem;
        padding: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Donate Blood</h1>

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="donate.html" aria-current="page">Donate</a></li>
        <li><a href="request.html">Request</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="signin.html">Sign In</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Donor Registration</h2>

      <div id="formMessage" role="status" aria-live="polite"></div>

      <form id="donorForm">
        <label for="name">
          Full Name:
          <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            autocomplete="name"
            required
          >
        </label>

        <label for="age">
          Age:
          <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="65"
            step="1"
            required
          >
        </label>

        <label for="bloodgroup">
          Blood Group:
          <select id="bloodgroup" name="bloodgroup" required>
            <option value="">Select blood group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </label>

        <label for="phone">
          Phone:
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9]{10}"
            minlength="10"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="10-digit number"
            required
          >
        </label>

        <label for="city">
          City:
          <input
            type="text"
            id="city"
            name="city"
            maxlength="100"
            autocomplete="address-level2"
            required
          >
        </label>

        <button type="submit" id="submitButton">
          Register as Donor
        </button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 LifeSaver Blood Bank. All rights reserved.</p>
  </footer>

  <script>
    const donorForm = document.getElementById("donorForm");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");

    function showMessage(message, type) {
      formMessage.textContent = message;
      formMessage.className = type;
      formMessage.style.display = "block";
    }

    donorForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!donorForm.reportValidity()) {
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Registering...";
      formMessage.style.display = "none";

      try {
        const donor = Object.fromEntries(
          new FormData(donorForm).entries()
        );

        const response = await fetch("/api/donors", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(donor)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          showMessage(
            result.message || "Registration failed. Please try again.",
            "error"
          );
          return;
        }

        showMessage(
          "Donor registered successfully! Thank you for supporting blood donation.",
          "success"
        );

        donorForm.reset();
      } catch (error) {
        console.error("Donor registration error:", error);

        showMessage(
          "Could not connect to the server. Please check that the application is running and try again.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Register as Donor";
      }
    });
  </script>
</body>
</html>
